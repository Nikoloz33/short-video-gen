[project]
name = "instructvid-agent"
version = "0.1.0"
description = "Chat agent that turns source documents into fact-checked instructional videos"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-genai>=1.40",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "pyyaml>=6.0.2",
    "structlog>=25.4",
]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-cov>=7.0",
    "ruff>=0.13",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.uv]
# The system Python 3.12 on the dev machine is broken (no subprocess module): only use uv-managed builds.
python-preference = "only-managed"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["video", "web", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "T20", "N", "PTH", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Georgian text in strings/comments is intentional

[tool.ruff.lint.per-file-ignores]
"agent/tests/**" = ["PTH"]

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["agent"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["agent/tests"]
asyncio_mode = "auto"
markers = ["live: calls real Vertex AI / renders with real models (opt-in, costs money)"]
addopts = "-m \"not live\" --cov=agent --cov-report=term-missing:skip-covered --cov-fail-under=85"

[tool.coverage.run]
source = ["agent"]
omit = ["agent/tests/*"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]
