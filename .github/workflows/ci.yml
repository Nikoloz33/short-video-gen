name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    runs-on: ubuntu-latest
    env:
      FFMPEG_DIR: /usr/bin
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run python -m agent.schemas.export --check
      - run: uv run pytest

  video:
    runs-on: ubuntu-latest
    env:
      FFMPEG_DIR: /usr/bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: ffmpeg + chromium deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run codegen -w video -- --check
      - run: npm run typecheck -w video
      - run: npm test -w video
      - run: npm run render:smoke -w video
      - run: npm run test:stills -w video

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w web
      - run: npm test -w web
      - run: npm run lint
      - run: npm run build -w web
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Remotion browser (reused by Playwright)
        run: npx remotion browser ensure
        working-directory: video
      - run: npm run e2e -w web
